<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 100px;
            color: #2563eb;
            margin: 0;
        }

        p {
            color: #64748b;
            margin: 20px 0;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The requested resource could not be found.</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
