<div class="app-shell" [attr.data-theme]="theme()">
  <aside class="sidebar" [class.is-open]="menuOpen()">
    <div class="sidebar-brand">
      <app-icon name="building-2" [size]="24" />
      <span>Construction</span>
    </div>
    <nav aria-label="Primary">
      <ul class="nav-list">
        @for (item of navItems; track item.id) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              class="nav-item"
              (click)="closeMenu()"
            >
              <app-icon [name]="item.icon" [size]="18" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <div class="sidebar-overlay" [class.is-visible]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-left">
      <button
        type="button"
        class="btn btn-icon btn-ghost menu-toggle"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <app-icon name="menu" [size]="18" />
      </button>
      @if (outlet.topbarHeading(); as heading) {
        <ng-container [ngTemplateOutlet]="heading"></ng-container>
      } @else if (pageMeta(); as meta) {
        <div class="topbar-page-title">
          <h1 class="topbar-page-title-heading">{{ meta.title }}</h1>
          @if (meta.subtitle) {
            <p class="topbar-page-title-subtitle">{{ meta.subtitle }}</p>
          }
        </div>
      }
    </div>
    <div class="topbar-right">
      <button
        type="button"
        class="btn btn-icon btn-ghost"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' mode'"
        [title]="'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' mode'"
      >
        <app-icon [name]="theme() === 'light' ? 'moon' : 'sun'" [size]="18" />
      </button>
      <button type="button" class="btn btn-icon btn-ghost" aria-label="Notifications">
        <app-icon name="bell" [size]="18" />
      </button>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
